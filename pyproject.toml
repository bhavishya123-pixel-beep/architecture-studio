[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "junior-architect"
version = "0.2.0"
description = "An AI junior architect that drafts in AutoCAD via natural-language chat."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest>=8.0"]

[project.scripts]
junior-architect = "junior_architect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
